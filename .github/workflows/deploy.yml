# Builds the portfolio and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repo on github.com:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions:
#     - Secret   VITE_WEB3FORMS_KEY  (contact form; optional until you have it)
#     - Variable VITE_SITE_URL       (only if you add a custom domain)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Work out the site address
        id: site
        env:
          CUSTOM_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "$CUSTOM_URL" ]; then
            BASE="/"; URL="${CUSTOM_URL%/}"
          elif [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$OWNER.github.io" ]; then
            BASE="/"; URL="https://$OWNER.github.io"
          else
            BASE="/$REPO/"; URL="https://$OWNER.github.io/$REPO"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Site: $URL (base $BASE)"

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.site.outputs.base }}
          VITE_SITE_URL: ${{ steps.site.outputs.url }}
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
